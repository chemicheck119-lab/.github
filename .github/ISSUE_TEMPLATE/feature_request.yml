name: Feature proposal
description: 사용자 문제와 검증 기준이 있는 기능을 제안합니다.
title: "feat(scope): "
labels:
  - "type:feature"
body:
  - type: markdown
    attributes:
      value: "`scope`를 영어 영향 영역으로 바꾸세요. 예: `feat(evaluation): 교차지역 STT 평가 추가`. 설명은 한국어를 기본으로 하되 기술 용어는 억지로 번역하지 않습니다."
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 기능이 아니라 사용자와 상황의 문제부터 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: user
    attributes:
      label: 대상 사용자와 사용 시점
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 비교한 대안과 선택 기준
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료·검증 기준
      description: 측정 방법과 목표값을 구분해서 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: evidence_state
    attributes:
      label: 현재 사실 상태
      options:
        - 검증되지 않은 가설
        - 설계 완료·구현 전
        - 부분 구현 또는 개발용 데모
        - 구현 완료
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 안전성·데이터 한계
      description: 오판, 누락, 데이터 시점, 사람 확인 Gate에 미치는 영향을 적어 주세요.
